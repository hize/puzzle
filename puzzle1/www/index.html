<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a1020">
<meta name="description" content="经典推箱子游戏，内置 170 个关卡：初级 20 关、中级 50 关、高级 100 关。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="推箱子">
<title>推箱子 · Sokoban</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles/main.css">
</head>
<body>
<div id="app">

  <!-- ============================ 首页 ============================ -->
  <section class="screen home active" id="screen-home">
    <div class="brand-mark">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect x="6" y="6" width="36" height="36" rx="9" stroke="#8fb6ff" stroke-width="2.5" opacity=".55"/>
        <rect x="10" y="10" width="14" height="14" rx="3" fill="#e0a860"/>
        <rect x="10" y="10" width="14" height="14" rx="3" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.6"/>
        <circle cx="33" cy="33" r="6.5" fill="#4b8bea"/>
        <circle cx="33" cy="33" r="6.5" fill="none" stroke="#a9ceff" stroke-opacity=".6" stroke-width="1.6"/>
        <circle cx="33" cy="17" r="3.2" fill="#2fd39a"/>
      </svg>
    </div>
    <h1>推 箱 子</h1>
    <p class="tagline">Sokoban Puzzle</p>
    <div class="tier-list" id="tier-list"></div>
    <div class="home-foot">
      <span id="overall-progress">—</span>
      <button class="linkish" id="btn-reset-progress" type="button">清空进度</button>
      <button class="linkish" id="btn-sound" type="button">音效：开</button>
    </div>
  </section>

  <!-- ========================== 关卡选择 ========================== -->
  <section class="screen" id="screen-levels">
    <header class="topbar">
      <button class="icon-btn" id="btn-levels-back" type="button" aria-label="返回">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="title-wrap">
        <div class="title" id="levels-title">关卡选择</div>
        <div class="subtitle" id="levels-subtitle">—</div>
      </div>
      <button class="icon-btn" id="btn-levels-reset" type="button" aria-label="重置本难度进度">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </header>
    <div class="scroll level-scroll">
      <div class="grid-wrap">
        <div class="grid-head" id="levels-head"></div>
        <div class="levels" id="levels-grid"></div>
      </div>
    </div>
  </section>

  <!-- ============================ 游戏 ============================ -->
  <section class="screen game" id="screen-game">
    <header class="topbar">
      <button class="icon-btn" id="btn-game-back" type="button" aria-label="返回">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="title-wrap">
        <div class="title" id="game-title">第 1 关</div>
        <div class="subtitle" id="game-subtitle">初级</div>
      </div>
      <button class="icon-btn" id="btn-prev" type="button" aria-label="上一关">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="icon-btn" id="btn-next" type="button" aria-label="下一关">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </header>

    <div class="hud">
      <div class="stat"><div class="k">步数</div><div class="v" id="stat-moves">0</div></div>
      <div class="stat"><div class="k">推动</div><div class="v" id="stat-pushes">0</div></div>
      <div class="stat"><div class="k">最佳</div><div class="v" id="stat-best">—</div></div>
    </div>

    <div class="stage" id="stage">
      <div class="board-frame">
        <div class="board" id="board"></div>
      </div>
    </div>

    <div class="kbd-hint" id="kbd-hint">方向键 / WASD 移动 · U 撤销 · R 重开</div>

    <div class="controls">
      <div class="pad">
        <button class="up" data-dir="up" type="button" aria-label="上">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
        <button class="left" data-dir="left" type="button" aria-label="左">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <button class="down" data-dir="down" type="button" aria-label="下">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
        </button>
        <button class="right" data-dir="right" type="button" aria-label="右">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
      <div class="side-actions">
        <button id="btn-undo" type="button" aria-label="撤销">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-2"/></svg>
        </button>
        <button id="btn-restart" type="button" aria-label="重开">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- ========================= 通关弹窗 ========================= -->
  <div class="modal" id="modal-win">
    <div class="card">
      <div class="badge" id="win-badge">🎉</div>
      <h2 id="win-title">过关！</h2>
      <p id="win-subtitle">干得漂亮</p>
      <div class="stats">
        <div class="stat"><div class="k">步数</div><div class="v" id="win-moves">0</div></div>
        <div class="stat"><div class="k">推动</div><div class="v" id="win-pushes">0</div></div>
        <div class="stat"><div class="k">最佳</div><div class="v" id="win-best">0</div></div>
      </div>
      <div class="actions">
        <button class="btn ghost" id="win-replay" type="button">再来一次</button>
        <button class="btn primary" id="win-next" type="button">下一关</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="src/data/levels.js"></script>
<script src="src/js/storage.js"></script>
<script src="src/js/audio.js"></script>
<script src="src/js/engine.js"></script>
<script src="src/js/board.js"></script>
<script src="src/js/ui.js"></script>
<script src="src/js/main.js"></script>
</body>
</html>
